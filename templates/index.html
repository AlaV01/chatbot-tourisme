<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Travel Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f9;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    #chat-wrap {
      width: 420px;
      height: 600px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
    }

    #chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid #e8ecf0;
      background: #ffffff;
    }
    .header-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #e8f0fe;
      display: flex; align-items: center; justify-content: center;
      color: #1a73e8;
      font-size: 18px;
      flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-info p { font-size: 14px; font-weight: 600; color: #1a1a2e; }
    .header-info span { font-size: 12px; color: #6b7280; }
    .header-status {
      font-size: 12px;
      color: #16a34a;
      display: flex; align-items: center; gap: 5px;
    }
    .header-status::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #22c55e;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #f8fafc;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    .msg-row { display: flex; align-items: flex-end; gap: 8px; }
    .msg-row.user { flex-direction: row-reverse; }
    .msg-col { display: flex; flex-direction: column; max-width: 78%; }
    .msg-row.user .msg-col { align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }
    .bubble.bot {
      background: #ffffff;
      border: 1px solid #e8ecf0;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: #1a73e8;
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bot-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: #e8f0fe;
      display: flex; align-items: center; justify-content: center;
      color: #1a73e8;
      font-size: 14px;
      flex-shrink: 0;
    }

    .msg-time { font-size: 11px; color: #9ca3af; margin-top: 4px; padding: 0 2px; }

    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 2px 0; }
    .typing-dots span {
      width: 7px; height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }

    #suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 16px 10px;
      background: #ffffff;
      border-top: 1px solid #e8ecf0;
    }
    .suggestion-chip {
      font-size: 12px;
      padding: 5px 11px;
      border-radius: 20px;
      border: 1px solid #d1d5db;
      background: #f8fafc;
      color: #4b5563;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      font-family: inherit;
    }
    .suggestion-chip:hover { background: #e8f0fe; color: #1a73e8; border-color: #1a73e8; }

    #input-area {
      padding: 12px 14px;
      border-top: 1px solid #e8ecf0;
      background: #ffffff;
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    #msg-input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      color: #1a1a2e;
      background: #f8fafc;
      resize: none;
      outline: none;
      max-height: 100px;
      overflow-y: auto;
      line-height: 1.5;
      transition: border-color 0.15s;
    }
    #msg-input:focus { border-color: #1a73e8; background: #fff; }
    #msg-input::placeholder { color: #9ca3af; }

    #send-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: #1a73e8;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: white;
      font-size: 17px;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    #send-btn:hover { background: #1557b0; }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { background: #d1d5db; cursor: default; }
  </style>
</head>
<body>

<div id="chat-wrap">

  <div id="chat-header">
    <div class="header-avatar"><i class="ti ti-world"></i></div>
    <div class="header-info">
      <p>Travel Assistant</p>
      <span>Powered by AI</span>
    </div>
    <div class="header-status">Online</div>
  </div>

  <div id="messages">
    <div class="msg-row">
      <div class="bot-avatar"><i class="ti ti-world"></i></div>
      <div class="msg-col">
        <div class="bubble bot">Hi! I'm your travel assistant ✈️ Ask me anything about destinations, hotels, flights, or travel tips.</div>
        <span class="msg-time" id="welcome-time"></span>
      </div>
    </div>
  </div>

  <div id="suggestions">
    <button class="suggestion-chip" onclick="useSuggestion(this)">Best beaches in Europe</button>
    <button class="suggestion-chip" onclick="useSuggestion(this)">Cheapest flights to Asia</button>
    <button class="suggestion-chip" onclick="useSuggestion(this)">Hidden gems in Morocco</button>
  </div>

  <div id="input-area">
    <textarea id="msg-input" placeholder="Ask about any destination..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()" aria-label="Send">
      <i class="ti ti-send"></i>
    </button>
  </div>

</div>

<script>
  const input = document.getElementById('msg-input');
  const messages = document.getElementById('messages');
  const sendBtn = document.getElementById('send-btn');
  const suggestions = document.getElementById('suggestions');

  document.getElementById('welcome-time').textContent = now();

  input.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function now() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(text, type) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + type;

    if (type === 'bot') {
      row.innerHTML = `
        <div class="bot-avatar"><i class="ti ti-world"></i></div>
        <div class="msg-col">
          <div class="bubble bot">${text}</div>
          <span class="msg-time">${now()}</span>
        </div>`;
    } else {
      row.innerHTML = `
        <div class="msg-col">
          <div class="bubble user">${text}</div>
          <span class="msg-time">${now()}</span>
        </div>`;
    }

    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return row;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row';
    row.id = 'typing-indicator';
    row.innerHTML = `
      <div class="bot-avatar"><i class="ti ti-world"></i></div>
      <div class="bubble bot" style="padding: 12px 16px;">
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>`;
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  function useSuggestion(el) {
    input.value = el.textContent;
    input.dispatchEvent(new Event('input'));
    suggestions.style.display = 'none';
    input.focus();
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    suggestions.style.display = 'none';
    addMessage(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      removeTyping();
      addMessage(data.reply || 'Sorry, no response received.', 'bot');
    } catch (err) {
      removeTyping();
      addMessage('Something went wrong. Please try again.', 'bot');
    }

    sendBtn.disabled = false;
    input.focus();
  }
</script>

</body>
</html>
